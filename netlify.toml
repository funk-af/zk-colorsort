[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API routes for the Discord Activity. Forced so they win over the SPA
# fallback below, which would otherwise answer with index.html.
[[redirects]]
  from = "/api/discord-token"
  to = "/.netlify/functions/discord-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/submit-sponsored"
  to = "/.netlify/functions/submit-sponsored"
  status = 200
  force = true

[[redirects]]
  from = "/api/discord-interactions"
  to = "/.netlify/functions/discord-interactions"
  status = 200
  force = true

# SPA fallback: puzzle codes and daily dates are client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.(zkey|wasm)"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

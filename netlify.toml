[build]
  command = "pnpm build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback: puzzle codes and daily dates are client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.(zkey|wasm)"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

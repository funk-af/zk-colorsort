[algokit]
min_version = "v2.0.0"

[project]
type = "contract"
name = "zk-colorsort"
artifacts = "contracts/artifacts"

[project.run]
build = { commands = [
	"pnpm run build:contracts",
], description = "Build smart contracts and generate client" }
test = { commands = [
	"pnpm test:contracts",
], description = "Run contract test suite" }
deploy = { commands = [
	"pnpm dlx tsx contracts/deploy.ts",
], description = "Deploy PuzzleScores using contracts/deploy-config.ts" }

[project.deploy]
command = "pnpm dlx tsx contracts/deploy.ts"
